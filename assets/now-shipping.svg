<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Recent work: two merged Zedu desktop fixes and a Zedu web pricing page PR in review">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12040C"/>
      <stop offset="1" stop-color="#1F0817"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .l{opacity:0;animation:in .45s ease-out forwards}
      .l1{animation-delay:.3s}.l2{animation-delay:1.1s}.l3{animation-delay:1.7s}.l4{animation-delay:2.3s}.l5{animation-delay:3.1s}
      @keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
      .cursor{animation:blink 1.1s steps(1) 3.3s infinite;opacity:0}
      @keyframes blink{0%{opacity:1}50%{opacity:0}}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="22" fill="url(#bg)" stroke="#FF4F9A" stroke-opacity="0.4"/>
  <path d="M1 50h1278" stroke="#FF4F9A" stroke-opacity="0.18"/>
  <circle cx="30" cy="26" r="6" fill="#FF5F8F"/><circle cx="52" cy="26" r="6" fill="#FFB3D1"/><circle cx="74" cy="26" r="6" fill="#FFE6F1"/>
  <text x="640" y="31" text-anchor="middle" class="mono" font-size="14" fill="#C79AB2">~/zedu  —  now shipping</text>

  <g class="mono" font-size="17">
    <text class="l l1" x="36" y="96"><tspan fill="#FF4F9A">hassanat</tspan><tspan fill="#7A4A62"> ~/zedu </tspan><tspan fill="#FFC2DD">$ </tspan><tspan fill="#FFE6F1">git log --author=me --oneline</tspan></text>

    <g class="l l2">
      <text x="36" y="140" fill="#9FE8C7">●</text><text x="62" y="140" fill="#FFB3D1">fix(CYBERTRON-42)</text><text x="300" y="140" fill="#FFE6F1">desktop DM notifications open the right conversation</text>
      <rect x="1104" y="122" width="140" height="26" rx="13" fill="#9FE8C7" fill-opacity="0.14" stroke="#9FE8C7" stroke-opacity="0.6"/>
      <text x="1174" y="140" text-anchor="middle" fill="#9FE8C7" font-size="14">merged</text>
    </g>
    <g class="l l3">
      <text x="36" y="180" fill="#9FE8C7">●</text><text x="62" y="180" fill="#FFB3D1">fix(CYBERTRON-44)</text><text x="300" y="180" fill="#FFE6F1">friendly "no account" message on magic-link login</text>
      <rect x="1104" y="162" width="140" height="26" rx="13" fill="#9FE8C7" fill-opacity="0.14" stroke="#9FE8C7" stroke-opacity="0.6"/>
      <text x="1174" y="180" text-anchor="middle" fill="#9FE8C7" font-size="14">merged</text>
    </g>
    <g class="l l4">
      <text x="36" y="220" fill="#FFC2DD">◐</text><text x="62" y="220" fill="#FFB3D1">feat(CYBERTRON-608)</text><text x="300" y="220" fill="#FFE6F1">full naira price &amp; currency note on pricing page</text>
      <rect x="1104" y="202" width="140" height="26" rx="13" fill="#FF4F9A" fill-opacity="0.14" stroke="#FF4F9A" stroke-opacity="0.7"/>
      <text x="1174" y="220" text-anchor="middle" fill="#FF8FC7" font-size="14">in review</text>
    </g>

    <text class="l l5" x="36" y="264"><tspan fill="#FF4F9A">hassanat</tspan><tspan fill="#7A4A62"> ~/zedu </tspan><tspan fill="#FFC2DD">$ </tspan></text>
    <rect class="cursor" x="226" y="250" width="10" height="19" fill="#FF4F9A"/>
  </g>
</svg>
